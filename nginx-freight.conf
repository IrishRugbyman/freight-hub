# freight.lbzgiu.xyz - PARKED 2026-08-16.
#
# Why: the aisstream.io feed went silent ("ais stream dropped", "0 vessels held in
# memory, feed appears silent", backing off to 1024s reconnects), so the tracker had
# no live data to serve. On the same day, while the box was freezing, a stuck
# freight-analytics run was found sitting in `activating` holding 1.49 GB. The whole
# freight stack was stopped, returning ~1.7 GB of RAM.
#
# Stopped AND disabled (survives reboot):
#   freight-api.service  ais-collector.service
#   freight-analytics.timer  freight-analytics-derived.timer
#
# NOT deleted: ais_positions.duckdb and freight_analytics.duckdb are untouched.
# ~/ops/backup.sh keeps backing them up; its stop/start of the collector is gated on
# `collector_was_active`, so a disabled collector is skipped rather than resurrected.
# The DB is now quiescent, which makes that nightly copy trivially consistent.
#
# TO RESTORE:
#   git -C ~/quant/freight checkout nginx-freight.conf    # this file, pre-parking
#   sudo systemctl enable --now freight-api ais-collector \
#        freight-analytics.timer freight-analytics-derived.timer
#   sudo nginx -t && sudo systemctl reload nginx
#   THEN: freight returns ~1.7 GB to system.slice, so MemoryHigh in
#   /etc/systemd/system/user-1000.slice.d/memory.conf must come back down from
#   10752M to 9G. Those two facts move together; read that file before touching this.
#
# The vhost deliberately STAYS in nginx rather than being unlinked from
# sites-enabled: `certbot renew` needs a server block for this name, and removing it
# would let the certificate lapse and make restoring the site a bigger job than
# flipping four units back on.

server {
    server_name freight.lbzgiu.xyz;

    root /var/www/freight-parked;

    # Keep ACME reachable so certificate renewal keeps working while parked.
    # ^~ so it wins over the catch-all 503 below regardless of match order.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 503, not 404 and not 200: this is temporary. Crawlers treat 503 as "come back
    # later" and keep the URLs indexed, where a 404 tells them to drop the site.
    # Every path lands here, including the old /api/ routes, so a stale frontend in
    # someone's cache gets an honest status rather than a proxy error to a dead port.
    location / {
        return 503;
    }

    # error_page preserves the 503 status while serving the page body.
    error_page 503 /index.html;
    location = /index.html {
        internal;
        add_header Retry-After 86400 always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/freight.lbzgiu.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/freight.lbzgiu.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = freight.lbzgiu.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name freight.lbzgiu.xyz;
    return 404; # managed by Certbot


}
