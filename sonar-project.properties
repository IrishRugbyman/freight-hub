sonar.projectKey=IrishRugbyman_freight-hub
sonar.organization=irishrugbyman

# backend/tests/fixtures/ holds saved third-party HTML pages (Equasis, MyShipTracking)
# used as scraper fixtures. They are captured verbatim on purpose, so accessibility and
# inline-script findings in them are not actionable (93 issues).
#
# NOTE: SonarQube Cloud Automatic Analysis IGNORES sonar.exclusions from this file.
# The exclusion that actually takes effect is the project-level setting, under
# Administration > Analysis Scope > Source File Exclusions (set via api/settings/set).
# Keep the two in sync: the line below only becomes live if this project ever moves
# to CI-based analysis with sonar-scanner.
sonar.exclusions=backend/tests/fixtures/**
